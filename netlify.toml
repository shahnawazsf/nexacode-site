# ─────────────────────────────────────────────────────────────
# netlify.toml — NexaCode Website
# Netlify build, redirect, and HTTP header configuration
# ─────────────────────────────────────────────────────────────

[build]
  publish = "."          # Root folder is the published site
  command = ""           # No build command needed (static HTML)

# ── REDIRECTS ────────────────────────────────────────────────
# Force HTTPS on all traffic
[[redirects]]
  from   = "http://nexacode.sa/*"
  to     = "https://nexacode.sa/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.nexacode.sa/*"
  to     = "https://nexacode.sa/:splat"
  status = 301
  force  = true

# Redirect www → non-www (canonical domain)
[[redirects]]
  from   = "https://www.nexacode.sa/*"
  to     = "https://nexacode.sa/:splat"
  status = 301
  force  = true

# ── HTTP SECURITY HEADERS ────────────────────────────────────
# Applied to all pages — these are server-level headers which
# are stronger than the <meta> tag equivalents in the HTML.
[[headers]]
  for = "/*"
  [headers.values]

    # Content Security Policy
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self' https://wa.me;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    """

    # Clickjacking protection
    X-Frame-Options = "DENY"

    # MIME sniffing protection
    X-Content-Type-Options = "nosniff"

    # XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"

    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # HSTS — force HTTPS for 1 year, including subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Permissions policy — disable unused browser APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()"

    # Cache static HTML — revalidate every 5 minutes
    Cache-Control = "public, max-age=300, must-revalidate"

# Long cache for fonts (they don't change)
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long cache for images
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
